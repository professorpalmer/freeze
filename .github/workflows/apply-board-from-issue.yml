name: Apply Freese board from issue
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: freese-board-publish
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ startsWith(github.event.issue.title, '[freese-publish]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download board JSON from issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          mkdir -p incoming
          python3 - <<'PY'
          import os, re, urllib.request
          body = os.environ.get('ISSUE_BODY') or ''
          # Prefer explicit board URL, then github user-attachments, then any https json-ish link
          patterns = [
            r'BOARD_URL:\s*(\S+)',
            r'(https://github\.com/user-attachments/files/\S+)',
            r'(https://[^\s<>\"]+\.json)',
            r'(https://0x0\.st/\S+)',
            r'(https://litter\.catbox\.moe/\S+)',
            r'(https://files\.catbox\.moe/\S+)',
          ]
          url = None
          for pat in patterns:
            m = re.search(pat, body, re.I)
            if m:
              url = m.group(1).rstrip(').,]\'\"')
              break
          if not url:
            raise SystemExit('No board URL found in issue body')
          print('fetching', url)
          urllib.request.urlretrieve(url, 'incoming/board.json')
          print('saved', os.path.getsize('incoming/board.json'), 'bytes')
          PY

      - name: Apply board JSON
        run: node scripts/apply-board-json.cjs incoming/board.json

      - name: Commit board-data.js
        run: |
          git config user.name "freese-publish-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add board-data.js incoming/board.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "publish: apply board from issue #${{ github.event.issue.number }}"
          git push

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Applied to `board-data.js` and pushed. Render should redeploy https://freeze-index.onrender.com/ within a few minutes. Closing.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
